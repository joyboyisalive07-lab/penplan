name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Build
        run: pyinstaller penplan.spec --noconfirm --clean
      - name: Check the executable exists and is not a stub
        shell: pwsh
        run: |
          $exe = Get-Item dist/penplan.exe
          "{0:N1} MB" -f ($exe.Length / 1MB)
          if ($exe.Length -lt 5MB) { throw "the executable is too small to contain Python" }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/penplan.exe --generate-notes
